# ============================================================
# RESQHUB KUBERNETES DEPLOYMENT
# ============================================================

apiVersion: v1
kind: Namespace
metadata:
  name: resqhub

---
# ============================================================
# USER SERVICE
# ============================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: resqhub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: 737206603875.dkr.ecr.us-east-1.amazonaws.com/resqhub-user-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5001
          readinessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 30
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: resqhub
spec:
  type: ClusterIP
  selector:
    app: user-service
  ports:
    - port: 5001
      targetPort: 5001

