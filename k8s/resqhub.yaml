# ============================================================
# 12. API GATEWAY DEPLOYMENT
# ============================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: resqhub

spec:
  replicas: 1

  selector:
    matchLabels:
      app: api-gateway

  template:
    metadata:
      labels:
        app: api-gateway

    spec:
      containers:
        - name: api-gateway

          image: 737206603875.dkr.ecr.us-east-1.amazonaws.com/resqhub-api-gateway:latest

          imagePullPolicy: Always

          ports:
            - containerPort: 5000

          env:

            - name: USER_SERVICE_URL
              value: "http://user-service:5001"

            - name: INCIDENT_SERVICE_URL
              value: "http://incident-service:5002"

            - name: RESCUE_SERVICE_URL
              value: "http://rescue-service:5003"

            - name: RESOURCE_SERVICE_URL
              value: "http://resource-service:5004"

            - name: NOTIFICATION_SERVICE_URL
              value: "http://notification-service:5005"

          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 20

---
# ============================================================
# 13. API GATEWAY SERVICE
# ============================================================

apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: resqhub

spec:
  selector:
    app: api-gateway

  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000

  type: LoadBalancer

---
